name: Publish The Architecture of Feeling interactive research website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/archive/v2-9/**"
      - "docs/previews/v3-measured-beta/**"
      - "docs/previews/v3-1-measured-dna/**"
      - "docs/research/acousticbrainz/**"
      - ".github/workflows/publish-interactive-pages.yml"
  workflow_run:
    workflows: ["AcousticBrainz 25-song coverage audit"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-architecture-of-feeling-pages
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify status and stage ONLY approved site files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re, shutil

          root=Path('docs')
          idx=root/'index.html'
          v29=root/'archive/v2-9/index.html'
          v3=root/'previews/v3-measured-beta/index.html'
          v31=root/'previews/v3-1-measured-dna/index.html'
          lab=root/'research/acousticbrainz/Measured_Evidence_Lab.html'
          receipt=root/'research/acousticbrainz/preview_manifest.json'
          expected=[idx,v29,v3,v31,lab,receipt]
          if not all(p.is_file() and p.stat().st_size for p in expected):
              raise SystemExit('Missing a required public exhibit')
          if hashlib.sha256(v29.read_bytes()).hexdigest()!='3ba59e0030951051bcc4842fb2471b08a306dcb1aa838cdf1a9d06a8166eac21':
              raise SystemExit('Locked V2.9 creative exhibit changed')
          v3text=v3.read_text(encoding='utf-8')
          match=re.search(r'window\.AOF_V3_EVIDENCE\s*=\s*(\{.*?\});\s*const DATA\s*=',v3text,re.S)
          if not match:
              raise SystemExit('V3 evidence contract missing')
          data=json.loads(match.group(1))
          if data.get('status')!='EXPLORATORY_UNAPPROVED' or len(data.get('records',[]))!=167:
              raise SystemExit('V3 must be complete and exploratory-only')
          if sum(bool(r.get('selected_mbid')) for r in data['records'])!=148:
              raise SystemExit('Expected exactly 148 provisional source records')
          if data.get('summary',{}).get('approved_master')!=0:
              raise SystemExit('Unverified masters cannot be promoted')
          if 'STILL SYNTHETIC' not in v3text:
              raise SystemExit('Synthetic boundary missing in V3')
          v31text=v31.read_text(encoding='utf-8')
          v31_match=re.search(r'window\.AOF_V3_EVIDENCE\s*=\s*(\{.*?\});\s*const DATA\s*=',v31text,re.S)
          if not v31_match or v31_match.group(1)!=match.group(1):
              raise SystemExit('V3.1 evidence payload differs from source-linked V3.0')
          if not all(marker in v31text for marker in ('id="home-finale"','v31TreeSvg','source.length!==147','cohortLossless.length!==103')):
              raise SystemExit('V3.1 Sonic DNA or Home finale integrity marker missing')
          manifest=json.loads(receipt.read_text(encoding='utf-8'))
          if manifest.get('status')!='EXPLORATORY_UNAPPROVED':
              raise SystemExit('Measured lab must remain labelled unapproved')
          if manifest.get('html_sha256')!=hashlib.sha256(lab.read_bytes()).hexdigest():
              raise SystemExit('Measured lab source hash mismatch')
          home=idx.read_text(encoding='utf-8')
          if not all(href in home for href in ('archive/v2-9/index.html','previews/v3-measured-beta/index.html','previews/v3-1-measured-dna/index.html','research/acousticbrainz/Measured_Evidence_Lab.html')):
              raise SystemExit('Public homepage missing core exhibit navigation')

          # Explicit allowlist: no collector scripts, raw JSON archive, audio, lyrics, or private repo files.
          site=Path('_public_site')
          for source in expected:
              target=site/source.relative_to(root)
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(source,target)
          (site/'.nojekyll').touch()
          created={p.relative_to(site).as_posix() for p in site.rglob('*') if p.is_file()}
          allowed={'.nojekyll'} | {p.relative_to(root).as_posix() for p in expected}
          if created!=allowed:raise SystemExit('Unexpected public asset')
          print('Prepared six allowlisted static files plus .nojekyll, including V3.1')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload verified public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _public_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
