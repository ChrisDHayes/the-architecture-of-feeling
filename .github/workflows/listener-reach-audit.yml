name: V3.2 listener reach coverage audit

on:
  push:
    branches: [main]
    paths:
      - "research/popularity/**"
      - ".github/workflows/listener-reach-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline source identity, missingness and rights-gate tests
        run: python research/popularity/tools/test_popularity.py
      - name: Audit ListenBrainz unique listeners and total listens
        run: |
          python research/popularity/tools/audit_listenbrainz.py \
            --crosswalk research/popularity/data/sonic_dna_147_crosswalk.csv \
            --output research/popularity/results/latest \
            --batch-size 40
      - name: Validate coverage report before archiving
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          root=Path("research/popularity/results/latest")
          p=root/"recording_popularity.csv"
          summary=json.loads((root/"coverage_summary.json").read_text())
          with p.open(newline="",encoding="utf-8") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==147 and summary["recordings_checked"]==147
          assert sum(r["listenbrainz_status"]=="REPORTED" for r in rows)==summary["reported"]
          assert sum(r["listenbrainz_status"]=="NOT_REPORTED" for r in rows)==summary["null_not_reported"]
          assert summary["promotion_to_public_site"] is False
          assert summary["setlist_live_performances"]=="BLOCKED_PENDING_AUTHORIZATION_FOR_PUBLIC_STATIC_COUNTS"
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("## ListenBrainz recording coverage\n\n")
              out.write(f"- Reported: **{summary['reported']} / 147**\n")
              out.write(f"- Not reported: **{summary['null_not_reported']}**\n")
              out.write("- Recording-level counts only; public publication not approved.\n")
          print("Validated recording-level evidence and null handling")
          PY
      - name: Archive source-level audit as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: listenbrainz-147-recording-popularity-${{ github.run_number }}
          path: |
            research/popularity/results/latest/recording_popularity.csv
            research/popularity/results/latest/coverage_summary.json
          retention-days: 60
          if-no-files-found: error
