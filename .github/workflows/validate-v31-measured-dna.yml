name: Validate V3.1 measured Sonic DNA
on:
  push:
    branches: [main]
    paths:
      - "docs/previews/v3-1-measured-dna/**"
      - "docs/previews/v3-measured-beta/**"
      - "docs/archive/v2-9/**"
      - "research/catalogue/tools/test_v31_measured_dna.py"
      - ".github/workflows/validate-v31-measured-dna.yml"
  pull_request:
    paths:
      - "docs/previews/v3-1-measured-dna/**"
      - "docs/previews/v3-measured-beta/**"
      - "research/catalogue/tools/test_v31_measured_dna.py"
      - ".github/workflows/validate-v31-measured-dna.yml"
permissions:
  contents: read
jobs:
  measured-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Clone exact GitHub event revision using Git (no reusable Actions)
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch main "https://github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_WORKSPACE}/source"
          cd "${GITHUB_WORKSPACE}/source"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch --quiet --depth 1 origin "${GITHUB_REF}"
          else
            git fetch --quiet --depth 1 origin "${GITHUB_SHA}"
          fi
          git checkout --quiet --detach FETCH_HEAD
          echo "Validating commit $(git rev-parse HEAD) with $(python3 --version)"
      - name: Verify V2.9, V3.0 source evidence and measured V3.1 contracts
        run: cd "${GITHUB_WORKSPACE}/source" && python3 research/catalogue/tools/test_v31_measured_dna.py
