name: Validate measured V3 research beta
on:
  push:
    branches: [main]
    paths:
      - "docs/previews/v3-measured-beta/**"
      - "docs/archive/v2-9/**"
      - "research/catalogue/tools/test_v3_measured_beta.py"
      - "research/catalogue/tools/test_v3_home_finale.py"
      - ".github/workflows/validate-v3-research-beta.yml"
  pull_request:
    paths:
      - "docs/previews/v3-measured-beta/**"
      - "docs/archive/v2-9/**"
      - "research/catalogue/tools/test_v3_measured_beta.py"
      - ".github/workflows/validate-v3-research-beta.yml"
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fail-closed V2.9 / V3.0 integrity and synthetic-boundary checks
        run: python research/catalogue/tools/test_v3_measured_beta.py
      - name: Validate Home finale, exact source values, and official video link
        run: python research/catalogue/tools/test_v3_home_finale.py
