name: Actions startup health check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/actions-startup-healthcheck.yml"
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout with GitHub-authored action
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify checkout and run research tests
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          test -s research/popularity/tools/test_popularity.py
          python3 research/popularity/tools/test_popularity.py
          echo "GitHub-authored actions and repository checkout are operational."
