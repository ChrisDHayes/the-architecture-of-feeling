name: Actions startup health check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/actions-startup-healthcheck.yml"
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify runner, Python and public repository clone without reusable actions
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: ${RUNNER_OS}"
          python3 --version
          git --version
          dir="${RUNNER_TEMP}/aof-smoke"
          git clone --depth 1 --branch main "https://github.com/${GITHUB_REPOSITORY}.git" "${dir}"
          test -s "${dir}/research/popularity/tools/test_popularity.py"
          python3 "${dir}/research/popularity/tools/test_popularity.py"
          echo "Runner, Git clone and Python tests completed successfully."
