name: AcousticBrainz 25-song coverage audit
on:
  push:
    branches:
      - main
    paths:
      - "research/acousticbrainz/**"
      - ".github/workflows/acousticbrainz-25-audit.yml"
  workflow_dispatch:
    inputs:
      scope:
        description: "Scope (automatic main-branch runs audit all 25)"
        required: true
        type: choice
        options:
          - all_25
          - pilot_6
        default: all_25
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate 25-song registry
        run: python research/acousticbrainz/tools/test_registry.py
      - name: Verify persistent research-preview publication safeguards
        run: python research/acousticbrainz/tools/test_stage_research_preview.py
      - name: Collect acoustic evidence once
        env:
          AUDIT_SCOPE: ${{ inputs.scope || 'all_25' }}
        run: |
          python research/acousticbrainz/tools/audit25.py --scope "$AUDIT_SCOPE" --timeout 10 --output research/acousticbrainz/results/github_run
      - name: Review alternate album-linked recording candidates
        run: python research/acousticbrainz/tools/resolve_candidates.py --output research/acousticbrainz/results/github_run --timeout 10 --max-candidates 4
      - name: Run measured-evidence QA regression tests
        run: python research/acousticbrainz/tools/test_measured_evidence.py
      - name: Validate source descriptors, provenance and unapproved research status
        run: |
          python research/acousticbrainz/tools/validate_measured_evidence.py \
            --artifact-dir research/acousticbrainz/results/github_run \
            --output research/acousticbrainz/results/github_run/evidence_qa
      - name: Test measured-source evidence explorer
        run: python research/acousticbrainz/tools/test_evidence_explorer.py
      - name: Create offline source-descriptor evidence lab
        run: |
          python research/acousticbrainz/tools/build_evidence_explorer.py \
            --qa-dir research/acousticbrainz/results/github_run/evidence_qa \
            --output research/acousticbrainz/results/github_run/evidence_qa/Measured_Evidence_Lab.html
      - name: Stage permanent unapproved research preview (all 25 only)
        if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.scope == 'all_25') }}
        run: |
          python research/acousticbrainz/tools/stage_research_preview.py \
            --qa-dir research/acousticbrainz/results/github_run/evidence_qa \
            --destination docs/research/acousticbrainz \
            --min-retrieved 20
      - name: Commit permanent preview to repository docs
        if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.scope == 'all_25') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/acousticbrainz/Measured_Evidence_Lab.html docs/research/acousticbrainz/preview_manifest.json
          if git diff --cached --quiet; then
            echo "Published research preview unchanged."
          else
            git commit -m "chore(research): refresh unapproved evidence preview [skip ci]"
            git push origin HEAD:main
          fi
      - name: Report full and pilot summaries
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("research/acousticbrainz/results/github_run/coverage_report.json")
          if p.exists():
              data = json.loads(p.read_text(encoding="utf-8"))
              print("Overall:", json.dumps(data.get("summary", {}), indent=2))
              print("Pilot:", json.dumps(data.get("pilot_summary", {}), indent=2))
          else:
              print("No coverage_report.json produced; inspect logs.")
          PY
      - name: Save one combined evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acousticbrainz-25-song-coverage-${{ github.run_number }}
          path: research/acousticbrainz/results/github_run/
          retention-days: 30
          if-no-files-found: warn
